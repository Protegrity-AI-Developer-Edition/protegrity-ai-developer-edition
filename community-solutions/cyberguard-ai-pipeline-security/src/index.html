  <script>
    var _logs = [];
    var _origErr = console.error.bind(console);
    console.error = function() { _logs.push(Array.from(arguments).join(' ')); _origErr.apply(console, arguments); };

    function _showError(msg) {
      var el = document.getElementById('root');
      if (el) el.innerHTML = '<div style="padding:24px;font-family:monospace;font-size:13px;background:#1e1e2e;color:#f38ba8;margin:16px;border-radius:8px;white-space:pre-wrap">' + msg + '</div>';
    }
    window.onerror = function(msg, src, line, col) { _showError('ERROR: ' + msg + '\n  at ' + src + ':' + line + ':' + col); };
    window.addEventListener('unhandledrejection', function(e) { _showError('ASYNC ERROR: ' + e.reason); });

    // Catch script load failures (capturing phase — these don't bubble)
    window.addEventListener('error', function(e) {
      if (e.target && e.target.tagName === 'SCRIPT') {
        _showError('Script FAILED to load: ' + e.target.src + '\nCheck that vendor/ files exist.');
      }
    }, true);

    window._stage = [];

    // Fallback: if root is still empty after 5s, show all diagnostics
    setTimeout(function() {
      var root = document.getElementById('root');
      if (root && root.children.length === 0) {
        _showError(
          'React did not mount.\n\n' +
          'Load stages reached: ' + JSON.stringify(window._stage) + '\n\n' +
          'window.React: ' + !!window.React + '\n' +
          'window.ReactDOM: ' + !!window.ReactDOM + '\n' +
          'window.Babel: ' + !!window.Babel + '\n\n' +
          'console.error calls:\n' + (_logs.length ? _logs.join('\n') : '(none)')
        );
      }
    }, 5000);
  </script>
  <link rel="stylesheet" href="vendor/cyberguard.css">
  <script>window._stage.push('head-scripts-done');</script>
</head>

function _h32(s) { // djb2 — deterministic, no crypto needed for demo FPE
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = (Math.imul(h, 33) ^ s.charCodeAt(i)) >>> 0;
  return h;
}
function _tknIp(ip) {
  const h = _h32(ip);
  return `${100+(h&0x7f)}.${(h>>7)&0xff}.${(h>>15)&0xff}.${1+((h>>23)&0xfe)}`;
}
function _tknUser(u) { return 'usr_' + _h32(u).toString(16).slice(0,6); }
function _tknDev(d) {
  const C='ABCDEFGHJKLMNPQRSTUVWXYZ2346789'; let s='', n=_h32(d);
  for(let i=0;i<6;i++){s+=C[n%31];n=Math.floor(n/31);}
  return 'DEV-'+s;
}
function tokenizeTelemetry(records) {
  const vault = {};
  const tokenized = records.map(r => {
    const ts = _tknIp(r.src_ip), td = _tknIp(r.dst_ip), tu = _tknUser(r.username), tv = _tknDev(r.device_id);
    vault[ts]=r.src_ip; vault[td]=r.dst_ip; vault[tu]=r.username; vault[tv]=r.device_id;
    return {...r, src_ip:ts, dst_ip:td, username:tu, device_id:tv};
  });
  return { tokenized, vault };
}
function checkGuardrail(text, origRecords) {
  const flagged = [];
  for (const r of origRecords) {
    if (text.includes(r.src_ip))   flagged.push({ type:'Raw Internal IP', value:r.src_ip });
    if (text.includes(r.username)) flagged.push({ type:'Username PII',    value:r.username });
    if (text.includes(r.device_id))flagged.push({ type:'Raw Device ID',   value:r.device_id });
  }
  const unique = flagged.filter((f,i)=>flagged.findIndex(x=>x.value===f.value)===i);
  return { passed: unique.length === 0, flagged: unique };
}
function detokenize(text, vault) {
  let r = text;
  for (const [tok, val] of Object.entries(vault)) {
    const orig = (val && typeof val === 'object') ? val.original : val;
    r = r.split(tok).join(orig);
  }
  return r;
}

// ── Protegrity Demo — Live Pipeline Tab ───────────────────────────────────────
function DemoPipelineTab() {
  const [stage, setStage]       = useState(0);
  const [tokenResult, setTokenResult] = useState(null);
  const [llmResult, setLlmResult]     = useState(null);
  const [guardrail, setGuardrail]     = useState(null);
  const [report, setReport]           = useState(null);
  const [running, setRunning]         = useState(false);
  const [activeRow, setActiveRow]     = useState(null);

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const sevColor = s => s==='Critical'?{bg:'#fef2f2',text:'#dc2626',border:'#fecaca'}:s==='High'?{bg:'#fff7ed',text:'#ea580c',border:'#fed7aa'}:{bg:'#fefce8',text:'#ca8a04',border:'#fef08a'};

  async function runPipeline() {
    setRunning(true); setStage(0); setTokenResult(null); setLlmResult(null); setGuardrail(null); setReport(null);

    // Stage 1 — Ingest
    setStage(1);
    for (let i=0;i<DEMO_RAW.length;i++) { setActiveRow(i); await sleep(180); }
    setActiveRow(null);
    await sleep(400);

    // Stage 2 — Tokenize via real Protegrity Developer Edition API
    setStage(2);
    await sleep(400);
    let tok;
    try {
      const fields = DEMO_RAW.flatMap(r => [
        { value: r.src_ip,    element: 'string', _id: r.id, _field: 'src_ip'    },
        { value: r.dst_ip,    element: 'string', _id: r.id, _field: 'dst_ip'    },
        { value: r.username,  element: 'name',   _id: r.id, _field: 'username'  },
        { value: r.device_id, element: 'string', _id: r.id, _field: 'device_id' },
      ]);
      const res = cg.protegrityProtect
        ? await cg.protegrityProtect(fields.map(f => ({ value: f.value, element: f.element })))
        : null;
      if (res && !res.error && res.protected) {
        // Build tokenized records and vault from real Protegrity tokens
        const vault = {};
        const tokenMap = {};
        res.protected.forEach((p, i) => {
          tokenMap[`${fields[i]._id}|${fields[i]._field}`] = p.token;
          vault[p.token] = { original: p.original, element: fields[i].element };
        });
        const tokenized = DEMO_RAW.map(r => ({
          ...r,
          src_ip:    tokenMap[`${r.id}|src_ip`]    || r.src_ip,
          dst_ip:    tokenMap[`${r.id}|dst_ip`]    || r.dst_ip,
          username:  tokenMap[`${r.id}|username`]  || r.username,
          device_id: tokenMap[`${r.id}|device_id`] || r.device_id,
        }));
        tok = { tokenized, vault, realProtegrity: true };
      } else {
        tok = { ...tokenizeTelemetry(DEMO_RAW), realProtegrity: false };
      }
    } catch (_) {
      tok = { ...tokenizeTelemetry(DEMO_RAW), realProtegrity: false };
    }
    setTokenResult(tok);
    await sleep(400);

    // Stage 3 — LLM Inference (25s timeout so demo never hangs on slow CPU inference)
    setStage(3);
    const STUB = { model:'Kerrigan-Fantasma (cached — CPU timeout)', response: `INCIDENT REPORT — CyberGuard AI Pipeline [Protegrity-Protected]\nGenerated: ${new Date().toISOString()} | Classification: RESTRICTED\n\nEXECUTIVE SUMMARY\nAnalysis of tokenized endpoint telemetry reveals a coordinated multi-stage intrusion. Primary actor usr_6ca911 on device DEV-UN3KTE established C2 beaconing to external host via svchost.exe (port 443). Secondary actor usr_b12cba on device DEV-6CNCSD executed a 2.3 MB data exfiltration event over encrypted channel (port 8443) before installing a persistence mechanism. Lateral movement detected between DEV-UN3KTE and DEV-6CNCSD via NTLM relay.\n\nNIST 800-53 CONTROL FINDINGS\n• SC-28 (Protection at Rest): All PII fields tokenized by Protegrity before model ingestion. The inference engine operated on tokens only — real values never entered the AI context window.\n• AC-3 (Access Enforcement): Unauthorized cross-segment access from DEV-UN3KTE detected. De-tokenization enforced exclusively at authenticated analyst display layer.\n• CSF 2.0 PR.DS-1: Format-preserving tokens replace PII at rest within the AI context window. Model output confirmed PII-free by output guardrail — zero re-identification patterns detected.\n• AI RMF 1.0 MAP 1.6: Protect-before-ingest architecture reflects organizational risk priorities. Data minimization applied before AI processing.\n\nRECOMMENDED ACTIONS\n1. Isolate DEV-UN3KTE and DEV-6CNCSD immediately — preserve volatile memory\n2. Revoke credentials for usr_6ca911 and usr_b12cba — check for token reuse\n3. Block C2 destination ranges at perimeter firewall\n4. Initiate NIST SP 800-61 Rev 3 incident response — escalate to Tier 3 SOC`, isStub:true };
    const timeout = ms => new Promise(res => setTimeout(() => res(STUB), ms));
    const llm = await Promise.race([
      cg.demoLlmInfer ? cg.demoLlmInfer(tok.tokenized).catch(() => STUB) : Promise.resolve(STUB),
      timeout(25000),
    ]);
    setLlmResult(llm);
    await sleep(500);

    // Stage 4 — Guardrail
    setStage(4);
    await sleep(600);
    const gr = checkGuardrail(llm.response, DEMO_RAW);
    setGuardrail(gr);
    await sleep(500);

    // Stage 5 — De-tokenize via real Protegrity or vault fallback
    setStage(5);
    await sleep(400);
    let finalReport = llm.response;
    if (tok.realProtegrity && cg.protegrityUnprotect) {
      try {
        const tokensInText = Object.keys(tok.vault).filter(t => llm.response.includes(t));
        if (tokensInText.length > 0) {
          const fields = tokensInText.map(t => ({ token: t, element: tok.vault[t].element || 'text' }));
          const res = await cg.protegrityUnprotect(fields);
          if (res && !res.error && res.unprotected) {
            res.unprotected.forEach(u => {
              finalReport = finalReport.split(u.token).join(u.original);
            });
          } else {
            finalReport = detokenize(llm.response, tok.vault);
          }
        }
      } catch (_) {
        finalReport = detokenize(llm.response, tok.vault);
      }
    } else {
      finalReport = detokenize(llm.response, tok.vault);
    }
    setReport(finalReport);

    setRunning(false);
  }

  const STAGES = ['Ingest & Classify','Tokenize (Protegrity)','Model Inference','Output Guardrail','De-tokenize & Display'];
  const stageColor = i => stage > i+1 ? '#16a34a' : stage === i+1 ? '#2563eb' : '#9ca3af';

function _h32(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++)
    h = (Math.imul(h, 33) ^ s.charCodeAt(i)) >>> 0;
  return h;
}

// IP → IP  (format preserved: still looks like a real IP)
function _tknIp(ip) {
  const h = _h32(ip);
  return \`\${100+(h&0x7f)}.\${(h>>7)&0xff}.\${(h>>15)&0xff}.\${1+((h>>23)&0xfe)}\`;
}

// username → usr_xxxxxx
function _tknUser(u) {
  return 'usr_' + _h32(u).toString(16).slice(0, 6);
}

// device ID → DEV-XXXXXX  (format preserved)
function _tknDev(d) {
  const C = 'ABCDEFGHJKLMNPQRSTUVWXYZ2346789';
  let s = '', n = _h32(d);
  for (let i = 0; i < 6; i++) { s += C[n % 31]; n = Math.floor(n / 31); }
  return 'DEV-' + s;
}

// Tokenize all records — build a reverse vault for de-tokenization

    vault[ts]=r.src_ip; vault[td]=r.dst_ip;

    return { ...r, src_ip:ts, dst_ip:td, username:tu, device_id:tv };
  });
  return { tokenized, vault };
}`,

function checkGuardrail(text, origRecords) {

  // Deduplicate (same value may appear across multiple records)

  const runCve = async () => {
    setCveLoading(true);
    try { setCveResult(await cg.scanCve(cveQuery)); }
    catch(e) { setCveResult({error:e.message}); }
    finally { setCveLoading(false); }
  };

  const runHunt = async () => {
    setHuntLoading(true);
    try { setHuntResults(await cg.kerriganHunt(huntPath)); }
    catch(e) { setHuntResults({error:e.message}); }
    finally { setHuntLoading(false); }
  };

  const sevColor = s => s==='critical'?'bg-red-100 text-red-800':s==='high'?'bg-orange-100 text-orange-800':s==='medium'?'bg-yellow-100 text-yellow-800':'bg-blue-100 text-blue-800';

  return (
    <div className="space-y-4">
      {/* Security checks — live from main.js */}
      <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-lg font-bold text-gray-900">Live Security Checks</h3>
          <button onClick={runDeepScan} disabled={scanLoading}
            className="px-4 py-2 bg-red-500 text-white rounded-xl hover:bg-red-600 flex items-center text-sm disabled:opacity-50">
            <Bug className="w-4 h-4 mr-2"/>{scanLoading?'Scanning localhost…':'Deep Scan localhost'}
          </button>
        </div>
        <div className="space-y-2">
          {(secChecks||[]).map((c,i) => (
            <div key={i} className="flex items-center justify-between border border-gray-100 rounded-xl px-4 py-3">
              <div className="flex items-center">
                <div className={`w-2.5 h-2.5 rounded-full mr-3 ${c.status==='pass'?'bg-green-500':c.status==='warn'?'bg-yellow-500':'bg-red-500'}`}/>
                <div>
                  <span className="font-medium text-gray-900 text-sm">{c.name}</span>
                  {c.detail && <p className="text-xs text-gray-500 mt-0.5">{c.detail}</p>}
                </div>
              </div>
              <span className={`px-2 py-0.5 text-xs rounded-full flex-shrink-0 ml-3 ${c.status==='pass'?'bg-green-100 text-green-800':c.status==='warn'?'bg-yellow-100 text-yellow-800':'bg-red-100 text-red-800'}`}>{c.status}</span>
            </div>
          ))}
          {(!secChecks||secChecks.length===0) && <div className="text-gray-400 text-sm py-6 text-center">Security checks loading…</div>}
        </div>
        {scanResult && !scanResult.error && (
          <div className="mt-4 bg-gray-50 rounded-xl p-3">
            <div className="text-xs font-semibold text-gray-600 mb-2">Deep Scan — localhost</div>
            <div className="text-xs text-gray-500">{scanResult.ports?.open_count ?? 0} open ports · {scanResult.ports?.open?.map(p=>p.port).join(', ')||'none'}</div>
            {scanResult.headers && (
              <div className="text-xs text-gray-500 mt-1">
                HTTP headers: {scanResult.headers.checks?.filter(c=>c.present).length ?? 0}/{scanResult.headers.checks?.length ?? 0} security headers present
              </div>
            )}
          </div>
        )}
      </div>

      {/* NVD CVE Search */}
      <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
        <h3 className="text-lg font-bold text-gray-900 mb-3 flex items-center gap-2">
          <Search className="w-4 h-4 text-blue-500"/>NVD CVE Database Search
        </h3>
        <div className="flex gap-2 mb-3">
          <input value={cveQuery} onChange={e=>setCveQuery(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&runCve()}

            placeholder="e.g. macos sequoia, apache, openssl…"/>
          <button onClick={runCve} disabled={cveLoading}
            className="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700 disabled:opacity-50">
            {cveLoading?'Fetching…':'Search NVD'}
          </button>
        </div>
        {cveResult && !cveResult.error && (
          <div>
            <div className="text-xs text-gray-400 mb-2">{cveResult.total} total results for "{cveResult.query}" — showing top {cveResult.vulns?.length}</div>
            <div className="space-y-2 max-h-72 overflow-y-auto">
              {cveResult.vulns?.map((v,i)=>(
                <div key={i} className="flex items-start gap-3 p-3 bg-gray-50 rounded-lg">
                  <span className={`px-2 py-0.5 text-xs rounded-full flex-shrink-0 font-mono ${sevColor(v.severity)}`}>{v.score}</span>

      <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
        <h3 className="text-lg font-bold text-gray-900 mb-3">AI Threat Hunter</h3>
        <div className="flex gap-3 mb-4">

            <Search className="w-4 h-4 mr-2"/>{huntLoading?'Scanning…':'Hunt'}
          </button>
        </div>
        {huntResults && !huntResults.error && (
          <div>
            <div className="flex items-center gap-4 mb-3">
              <span className="text-sm font-medium text-gray-700">Risk Score: <span className="font-bold text-red-600">{huntResults.risk_score||0}</span></span>
              <span className="text-sm text-gray-500">{huntResults.total||0} findings</span>
            </div>
            <div className="space-y-2 max-h-64 overflow-y-auto">
              {(huntResults.findings||[]).map((f,i)=>(
                <div key={i} className="flex items-start p-3 bg-gray-50 rounded-lg">

    </div>
  );
}

    setLoading(l=>({...l,[key]:true}));

      if (key==='hd')  setHdResult(r);
      if (key==='ssl') setSslResult(r);

// ── AI Auto-Patcher ───────────────────────────────────────────────────────────
function AIPatcherView() {
  const [status, setStatus] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(()=>{
    const load = () => {
      const fetcher = cg.patcherStatus
        ? cg.patcherStatus()
        : fetch('http://127.0.0.1:7432/patcher/status').then(r=>r.json()).catch(()=>null);
      fetcher.then(s=>setStatus(s)).catch(()=>setStatus(null)).finally(()=>setLoading(false));
    };
    load();
    const t = setInterval(load, 8000);  // 8s so phase changes are visible
    return ()=>clearInterval(t);
  }, []);

  const phase = status?.fuzzer_phase ?? 'idle';
  const fzRunning = status?.fuzzer_running ?? false;

  // Map real fuzzer phase to each agent's displayed status
  const phaseAgent = {
    generating:  'Orchestrator',
    compiling:   'Fuzzer Engine',
    fuzzing:     'Fuzzer Engine',
    triaging:    'Vuln Classifier',
    analyzing:   'Program Model',
    evolving:    'Patch Generator',
  };
  const activeAgent = phaseAgent[phase] ?? '';

  const agentStatus = (name) => {
    if (!fzRunning) return 'idle';
    if (name === activeAgent) return 'running';
    // Orchestrator always coordinating while fuzzer runs
    if (name === 'Orchestrator' && fzRunning) return 'coordinating';
    // Regression Tester active when we have crashes to validate
    if (name === 'Regression Tester' && (status?.fuzzer_crashes??0)>0) return 'validating';
    // Vuln Classifier active when DB has crashes
    if (name === 'Vuln Classifier' && (status?.db_crashes??0)>0) return 'analyzing';
    return 'idle';
  };

  const agentTask = (name) => {
    const st = agentStatus(name);
    if (name === 'Fuzzer Engine') {
      if (st === 'running') {
        if (phase === 'fuzzing')   return status?.fuzzer_target ? `Fuzzing: ${status.fuzzer_target}` : 'Running mutation fuzzer';
        if (phase === 'compiling') return status?.fuzzer_last_event || 'Compiling harness…';
      }
      return status?.fuzzer_target ? `Last target: ${status.fuzzer_target}` : 'Awaiting next target';
    }
    if (name === 'Orchestrator') return fzRunning ? `Iteration ${status?.fuzzer_iteration??0} · ${_fmtUptime(status?.fuzzer_uptime??0)}` : 'Starting…';
    if (name === 'Program Model') return phase==='analyzing' ? (status?.fuzzer_last_event||'Analyzing crash…') : 'Idle';
    if (name === 'Vuln Classifier') return (status?.db_crashes??0)>0 ? `${status.db_crashes} crash(es) in DB` : 'Awaiting findings';
    if (name === 'Patch Generator') return phase==='evolving' ? (status?.fuzzer_last_event||'Evolving harness…') : 'Idle';
    if (name === 'Regression Tester') return (status?.fuzzer_crashes??0)>0 ? `${status.fuzzer_crashes} crash(es) this session` : 'Idle';
    if (name === 'Seed Generator') return fzRunning ? 'Feeding mutation seeds' : 'Idle';
    return 'Idle';
  };

  function _fmtUptime(secs) {
    if (!secs) return '0s';
    const h = Math.floor(secs/3600), m = Math.floor((secs%3600)/60), s = secs%60;
    return h>0 ? `${h}h ${m}m` : m>0 ? `${m}m ${s}s` : `${s}s`;
  }

  const agentNames = ['Orchestrator','Seed Generator','Fuzzer Engine','Program Model','Vuln Classifier','Patch Generator','Regression Tester'];

  return (
    <div className="space-y-4">
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        {[
          ['Iterations', status?.fuzzer_iteration ?? '…', 'text-blue-600', 'Total fuzzing iterations run'],
          ['Crashes Found', (status?.db_crashes ?? status?.fuzzer_crashes) ?? '…', 'text-red-600', 'kerrigan_db.crashes'],
          ['Sessions Run', status?.db_sessions ?? '…', 'text-purple-600', 'kerrigan_db.sessions'],
          ['Adaptive Rules', status?.adaptive_rules ?? '…', 'text-green-600', 'adaptive_defense.jsonl'],
        ].map(([label,val,color,sub],i)=>(
          <div key={i} className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 text-center">
            {loading ? <div className="text-2xl font-bold text-gray-300 animate-pulse">…</div>
              : <div className={`text-2xl font-bold ${color}`}>{val}</div>}
            <div className="text-sm font-medium text-gray-700">{label}</div>
            <div className="text-xs text-gray-400">{sub}</div>
          </div>
        ))}
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
          <div className="flex items-center justify-between mb-3">
            <h4 className="font-semibold text-gray-900">Active AI Agents</h4>
            {fzRunning && <span className="px-2 py-0.5 text-xs bg-green-100 text-green-800 rounded-full">fuzzer live</span>}
            {!fzRunning && !loading && <span className="px-2 py-0.5 text-xs bg-gray-100 text-gray-500 rounded-full">fuzzer offline</span>}
          </div>
          <div className="space-y-2">
            {agentNames.map((name,i)=>{
              const st = agentStatus(name);
              const task = agentTask(name);
              const dot = st==='running'?'bg-green-100 text-green-800':['coordinating','analyzing','validating'].includes(st)?'bg-blue-100 text-blue-800':'bg-gray-100 text-gray-500';
              return (
                <div key={i} className="flex items-center justify-between p-2.5 bg-gray-50 rounded-lg">
                  <div>
                    <div className="font-medium text-gray-900 text-sm">{name}</div>
                    <div className="text-xs text-gray-500">{task}</div>
                  </div>
                  <div className={`px-2 py-0.5 text-xs rounded-full flex-shrink-0 ml-2 ${dot}`}>{st}</div>
                </div>
              );
            })}
          </div>
        </div>

        <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
          <h4 className="font-semibold text-gray-900 mb-3">System Status</h4>
          <div className="space-y-2 text-sm">
            {[
              ['Kerrigan AI', status?.kerrigan_available?'Online':'Offline (using Ollama)', status?.kerrigan_available?'text-green-600':'text-yellow-600'],
              ['Fuzzer', fzRunning ? `${phase} · ${status?.fuzzer_target||''}` : 'idle', fzRunning?'text-green-600':'text-gray-400'],
              ['PQC Keys', status?.pqc_keys_exist?'Found in keys/':'Not found', status?.pqc_keys_exist?'text-green-600':'text-red-600'],
              ['Training Data', status?.stage4_files>0?`${status.stage4_files} files ready`:'No files', status?.stage4_files>0?'text-green-600':'text-gray-400'],
              ['Safety Gate', 'Overmind — active', 'text-green-600'],
            ].map(([k,v,c],i)=>(
              <div key={i} className="flex justify-between items-center">
                <span className="text-gray-600">{k}</span>
                <span className={`font-medium text-right max-w-[60%] truncate ${c}`}>{loading?'…':v}</span>
              </div>
            ))}
          </div>

          <div className="mt-4 bg-black rounded-xl p-3 font-mono text-xs leading-5">
            <div className="text-cyan-400">[PATCHER] Multi-agent system {fzRunning?'active':'starting…'}</div>
            {status?.fuzzer_last_event && <div className="text-yellow-400">[FUZZER] {status.fuzzer_last_event}</div>}
            {(status?.fuzzer_crashes??0)>0 && <div className="text-red-400">[VULN] {status.fuzzer_crashes} crash(es) this session</div>}
            {(status?.db_crashes??0)>0 && <div className="text-orange-400">[DB] {status.db_crashes} total crash(es) stored</div>}
            {(status?.adaptive_rules??0)>0 && <div className="text-green-400">[ADAPT] {status.adaptive_rules} adaptive rules loaded</div>}
            {(status?.stage4_examples??0)>0 && <div className="text-blue-400">[TRAIN] {status.stage4_examples} examples ready</div>}
            <div className="text-green-400">[OVERMIND] Safety gate — live weaponization blocked</div>
          </div>
        </div>
      </div>
    </div>
  );
}

       .finally(()=>setLoading(l=>({...l,[key]:false})));
  };

  useEffect(()=>{ run('ssh', ()=>cg.pentestSsh(), setSshData); }, []);

  const sc = s => s==='pass'?'bg-green-50 text-green-700':s==='fail'?'bg-red-50 text-red-700':'bg-yellow-50 text-yellow-700';
  const dot = s => s==='pass'?'bg-green-400':s==='fail'?'bg-red-400':'bg-yellow-400';

  const pqcChecks = [
    {name:'ML-KEM-768 (NIST FIPS 203)', status:'pass', note:'Post-quantum KEM — enabled'},
    {name:'SLH-DSA-SHA2-128s (FIPS 205)', status:'pass', note:'Post-quantum signing — enabled'},
    {name:'ML-DSA-65 (FIPS 204)', status:'warn', note:'Not yet integrated'},
    {name:'AES-256-GCM', status:'pass', note:'Symmetric — system standard'},
    {name:'RSA-4096', status:'warn', note:'Classical — vulnerable to Shor'},
    {name:'Ed25519', status:'pass', note:'Elliptic curve — strong'},
  ];

  return (
    <div className="space-y-4">
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
          <div className="flex items-center justify-between mb-3">
            <h4 className="font-semibold text-gray-900 flex items-center gap-2">
              <Key className="w-4 h-4 text-yellow-500"/>SSH Keys (~/.ssh)
            </h4>
            <button onClick={()=>run('ssh',()=>cg.pentestSsh(),setSshData)}
              disabled={loading.ssh}
              className="px-3 py-1 text-xs bg-gray-100 rounded-lg hover:bg-gray-200 disabled:opacity-50">
              {loading.ssh?'Scanning…':'Rescan'}
            </button>
          </div>
          {sshData && !sshData.error && (
            <>
              <div className="text-xs text-gray-400 mb-2">{sshData.key_count} private keys · {sshData.pubkey_count} public keys</div>
              {sshData.keys?.length === 0
                ? <div className="text-xs text-gray-400 italic">No private keys found in ~/.ssh</div>
                : sshData.keys?.map((k,i)=>(
                  <div key={i} className={`flex items-center justify-between px-3 py-2 rounded-lg text-sm mb-1 ${sc(k.status)}`}>
                    <span className="font-mono">{k.file}</span>
                    <span className="text-xs">{k.type} {k.bits>0?k.bits+'b':''}</span>
                  </div>
                ))}
            </>
          )}
          {sshData?.error && <div className="text-xs text-red-600">{sshData.error}</div>}
          {!sshData && loading.ssh && <div className="text-xs text-gray-400 animate-pulse">Scanning…</div>}
        </div>

        <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
          <h4 className="font-semibold text-gray-900 mb-3 flex items-center gap-2">
            <Lock className="w-4 h-4 text-blue-500"/>TLS/SSL Certificate Check
          </h4>
          <div className="flex gap-2 mb-3">
            <input value={tlsHost} onChange={e=>setTlsHost(e.target.value)}
              className="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm font-mono" placeholder="hostname"/>
            <input value={tlsPort} onChange={e=>setTlsPort(Number(e.target.value))}
              className="w-20 px-2 py-2 border border-gray-200 rounded-lg text-sm font-mono" placeholder="443"/>
            <button onClick={()=>run('tls',()=>cg.pentestSsl(tlsHost,tlsPort),setTlsData)}
              disabled={loading.tls}
              className="px-3 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700 disabled:opacity-50">
              {loading.tls?'…':'Check'}
            </button>
          </div>
          {tlsData && !tlsData.error && (
            <div className="space-y-1">
              {tlsData.checks?.map((c,i)=>(
                <div key={i} className={`flex items-center justify-between px-3 py-1.5 rounded-lg text-xs ${sc(c.status)}`}>
                  <span>{c.check}</span><span>{c.detail||c.status}</span>
                </div>
              ))}
            </div>
          )}
          {tlsData?.error && <div className="text-xs text-red-600">{tlsData.error}</div>}
        </div>
      </div>

      <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
        <h4 className="font-semibold text-gray-900 mb-3 flex items-center gap-2">
          <Shield className="w-4 h-4 text-purple-500"/>Post-Quantum Cryptography Status
        </h4>
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-2">
          {pqcChecks.map((c,i)=>(
            <div key={i} className="flex items-center justify-between px-3 py-2 bg-gray-50 rounded-lg text-sm">
              <span className="text-gray-700">{c.name}</span>

        <div className="mt-3 px-3 py-2 bg-purple-50 rounded-lg text-xs text-purple-700">
          PQC keys stored in <span className="font-mono">kerrigan-fantasma/keys/</span> — gitignored. Managed by liboqs backend.
        </div>
      </div>
    </div>
  );
}

// ── IDS/IPS ───────────────────────────────────────────────────────────────────
function IDSIPSView({ threats }) {
  const [hp, setHp]         = useState({ ssh: 0, web: 0, database: 0, total: 0, recent: [] });
  const [hpLoading, setHpLoading] = useState(false);
  const [ipLookup,  setIpLookup]  = useState({});  // ip -> result
  const [ipLoading, setIpLoading] = useState({});  // ip -> bool

  const lookupIp = async (ip) => {
    if (ipLookup[ip] || ipLoading[ip]) return;
    setIpLoading(l => ({...l, [ip]: true}));
    try {
      const r = await fetch(`https://ipapi.co/${ip}/json/`);
      const d = await r.json();
      setIpLookup(l => ({...l, [ip]: {
        country: d.country_name || '?',
        city:    d.city || '',
        org:     d.org || '',
        flag:    d.country_code ? `https://flagcdn.com/16x12/${d.country_code.toLowerCase()}.png` : null,
      }}));
    } catch(e) {
      setIpLookup(l => ({...l, [ip]: { country: 'Lookup failed', city:'', org:'' }}));
    }
    setIpLoading(l => ({...l, [ip]: false}));
  };

  const loadHoneypot = () => {
    setHpLoading(true);
    const fn = window.cyberguard?.honeypotCounts;
    (fn ? fn() : Promise.resolve({ ssh:0, web:0, database:0, total:0, recent:[] }))
      .then(d => { setHp(d||{}); setHpLoading(false); })
      .catch(() => setHpLoading(false));
  };

  useEffect(() => { loadHoneypot(); const t = setInterval(loadHoneypot, 15000); return () => clearInterval(t); }, []);

  const hpColor = n => n > 0 ? 'text-red-600 font-bold' : 'text-gray-400';

          ['Web','Port 8080',hp.web,'text-blue-500',Network],
          ['MySQL','Port 3307',hp.database,'text-orange-500',Database],
          ['FTP','Port 2121',hp.ftp,'text-green-500',Shield],
          ['SMTP','Port 2525',hp.smtp,'text-yellow-500',Network],
          ['RDP','Port 3389',hp.rdp,'text-red-500',Monitor],
        ].map(([label,sub,count,c,Icon],i)=>(
          <div key={i} className="bg-white rounded-2xl p-3 shadow-sm border border-gray-100 text-center">
            <div className="flex items-center justify-center mb-1">
              <Icon className={`w-5 h-5 ${c}`}/>
              {hpLoading && <div className="w-1.5 h-1.5 bg-blue-400 rounded-full animate-pulse ml-1"/>}
            </div>
            <div className={`text-xl font-bold ${count>0?'text-red-600':'text-gray-300'}`}>{count??0}</div>
            <div className="text-xs font-medium text-gray-700">{label}</div>
            <div className="text-xs text-gray-400">{sub}</div>
          </div>
        ))}
      </div>
      {(hp.subnets_blocked??0)>0 && (
        <div className="text-xs text-orange-700 bg-orange-50 border border-orange-200 rounded-lg px-3 py-2">
          {hp.subnets_blocked} subnet(s) auto-blocked after repeated hits
        </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        {/* Live threat detections */}
        <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
          <div className="flex items-center mb-3">
            <AlertTriangle className="w-5 h-5 text-red-600 mr-2"/>
            <h4 className="font-semibold text-red-800">Threat Detections ({threats.length})</h4>
          </div>
          <div className="space-y-2 max-h-56 overflow-y-auto">
            {threats.length===0

                      {ipLookup[e.attacker_ip].flag && <img src={ipLookup[e.attacker_ip].flag} alt="" className="flex-shrink-0"/>}
                      <div className="text-xs">

// ── Forensics ─────────────────────────────────────────────────────────────────
function ForensicsView() {
  const [procs, setProcs]       = useState([]);
  const [loading, setLoading]   = useState(false);
  const [filter, setFilter]     = useState('all'); // all | suspicious
  const [killing, setKilling]   = useState(null);
  const [killMsg, setKillMsg]   = useState(null);
  const [search, setSearch]     = useState('');

  const refresh = () => {
    setLoading(true);
    const cg = window.cyberguard || {};
    (cg.getProcesses ? cg.getProcesses() : Promise.resolve([])).then(list => {
      setProcs(list || []);
      setLoading(false);
    }).catch(() => setLoading(false));
  };

  useEffect(() => { refresh(); const t = setInterval(refresh, 8000); return () => clearInterval(t); }, []);

  const handleKill = (pid, name) => {
    if (!window.confirm(`Terminate "${name}" (PID ${pid})?`)) return;
    setKilling(pid);
    const cg = window.cyberguard || {};
    (cg.killProcess ? cg.killProcess(pid) : Promise.resolve({ ok: false, error: 'not available' })).then(r => {
      setKilling(null);
      setKillMsg(r.ok ? `✓ Process ${pid} terminated` : `✗ Failed: ${r.error}`);
      setTimeout(() => setKillMsg(null), 3000);
      if (r.ok) refresh();
    });
  };

  const visible = procs.filter(p => {
    if (filter === 'suspicious' && !p.suspicious) return false;
    if (search && !p.name.toLowerCase().includes(search.toLowerCase()) && !String(p.pid).includes(search)) return false;
    return true;
  });

  const suspicious = procs.filter(p => p.suspicious);

  return (
    <div className="space-y-4">
      {/* Stats row */}
      <div className="grid grid-cols-3 gap-4">
        {[[Database, String(procs.length), 'Running Processes', 'text-blue-500'],
          [AlertTriangle, String(suspicious.length), 'Flagged Suspicious', suspicious.length > 0 ? 'text-red-500' : 'text-green-500'],
          [Cpu, procs.length ? (procs.reduce((s,p)=>s+p.cpu,0)).toFixed(1)+'%' : '—', 'Total CPU', 'text-purple-500']
        ].map(([Icon,n,l,c],i) => (
          <div key={i} className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 text-center">
            <Icon className={`w-7 h-7 ${c} mx-auto mb-1`}/>
            <div className="text-xl font-bold text-gray-900">{n}</div>
            <div className="text-xs text-gray-500">{l}</div>
          </div>
        ))}
      </div>

      {/* Process Inspector */}
      <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
        <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
          <h3 className="text-lg font-bold text-gray-900">Live Process Inspector</h3>
          <div className="flex items-center gap-2 flex-wrap">
            {killMsg && <span className={`text-xs px-2 py-1 rounded-full font-medium ${killMsg.startsWith('✓')?'bg-green-100 text-green-700':'bg-red-100 text-red-700'}`}>{killMsg}</span>}
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search name or PID…"
              className="text-sm border border-gray-200 rounded-lg px-3 py-1.5 w-40 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
            <select value={filter} onChange={e=>setFilter(e.target.value)}
              className="text-sm border border-gray-200 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="all">All Processes</option>
              <option value="suspicious">Flagged Only</option>
            </select>
            <button onClick={refresh} disabled={loading}
              className="text-sm bg-blue-600 text-white px-3 py-1.5 rounded-lg hover:bg-blue-700 disabled:opacity-50">
              {loading ? 'Refreshing…' : 'Refresh'}
            </button>
          </div>
        </div>

        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="text-left text-xs text-gray-500 uppercase border-b border-gray-100">
                <th className="pb-2 pr-4">PID</th>
                <th className="pb-2 pr-4">Name</th>
                <th className="pb-2 pr-4">User</th>
                <th className="pb-2 pr-4">CPU %</th>
                <th className="pb-2 pr-4">MEM %</th>
                <th className="pb-2 pr-4">Status</th>
                <th className="pb-2">Action</th>
              </tr>
            </thead>
            <tbody>
              {visible.length === 0 && (
                <tr><td colSpan="7" className="py-6 text-center text-gray-400 text-sm">{loading ? 'Loading processes…' : 'No results'}</td></tr>
              )}
              {visible.map((p,i) => (
                <tr key={p.pid} className={`border-b border-gray-50 hover:bg-gray-50 transition-colors ${p.suspicious ? 'bg-red-50' : ''}`}>
                  <td className="py-2 pr-4 font-mono text-gray-500">{p.pid}</td>
                  <td className="py-2 pr-4 font-medium text-gray-900 max-w-xs truncate">{p.name}</td>
                  <td className="py-2 pr-4 text-gray-500">{p.user}</td>
                  <td className="py-2 pr-4">
                    <div className="flex items-center gap-2">
                      <div className="w-16 bg-gray-100 rounded-full h-1.5">
                        <div className={`h-1.5 rounded-full ${p.cpu>50?'bg-red-500':p.cpu>20?'bg-yellow-500':'bg-green-500'}`} style={{width:`${Math.min(p.cpu,100)}%`}}/>
                      </div>
                      <span className="text-gray-700">{p.cpu}%</span>
                    </div>
                  </td>
                  <td className="py-2 pr-4 text-gray-700">{p.mem}%</td>
                  <td className="py-2 pr-4">
                    {p.suspicious
                      ? <span className="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded-full font-medium">⚠ Flagged</span>
                      : <span className="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full">Normal</span>}
                  </td>
                  <td className="py-2">
                    <button onClick={() => handleKill(p.pid, p.name)} disabled={killing === p.pid}
                      className="text-xs bg-red-50 text-red-600 border border-red-200 px-2 py-1 rounded-lg hover:bg-red-100 disabled:opacity-50 transition-colors">
                      {killing === p.pid ? 'Killing…' : 'Kill'}
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* Attribution cards */}
      <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
        <h4 className="font-semibold text-gray-900 mb-4">Threat Attribution</h4>
        <div className="space-y-3">
          {[['Attack Pattern Classified','AdaptiveDefense classified attack pattern and saved rule to data/adaptive_defense.jsonl','High Confidence','bg-red-100 text-red-800'],
            ['Distillation Attack Detected','Extraction pattern rate exceeded 15 queries/60s. Defense mode: active (20% noise injection).','Medium Confidence','bg-yellow-100 text-yellow-800']
          ].map(([title,desc,badge,bc],i)=>(
            <div key={i} className="bg-gray-50 p-4 rounded-xl">
              <div className="flex justify-between items-start mb-1">
                <div className="font-medium text-gray-900">{title}</div>
                <span className={`text-xs ${bc} px-2 py-0.5 rounded-full`}>{badge}</span>
              </div>
              <div className="text-sm text-gray-600">{desc}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── Network Map ───────────────────────────────────────────────────────────────
function NetworkMapView({ devices, ports }) {
  const [arpData,    setArpData]    = useState(null);
  const [routes,     setRoutes]     = useState(null);
  const [scanResult, setScanResult] = useState(null);
  const [scanTarget, setScanTarget] = useState('127.0.0.1');
  const [loading,    setLoading]    = useState({});

  const run = (key, fn, setter) => {
    setLoading(l=>({...l,[key]:true}));
    fn().then(setter).catch(e=>setter({error:e.message}))
       .finally(()=>setLoading(l=>({...l,[key]:false})));
  };

  useEffect(()=>{
    run('arp',    ()=>cg.networkArp(),    setArpData);
    run('routes', ()=>cg.networkRoutes(), setRoutes);
  }, []);

  const allDevices = [
    ...(arpData?.devices||[]),
    ...(devices||[]).filter(d => !(arpData?.devices||[]).some(a=>a.ip===d.ip)),
  ];

  return (
    <div className="space-y-4">
      {/* ARP neighbors */}
      <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
        <div className="flex items-center justify-between mb-3">
          <h4 className="font-semibold text-gray-900 flex items-center gap-2">
            <Network className="w-4 h-4 text-blue-500"/>
            Live ARP Table — Discovered Devices ({allDevices.length})
          </h4>
          <button onClick={()=>run('arp',()=>cg.networkArp(),setArpData)}
            disabled={loading.arp}
            className="px-3 py-1 text-xs bg-gray-100 rounded-lg hover:bg-gray-200 disabled:opacity-50">
            {loading.arp?'Scanning…':'Refresh'}
          </button>
        </div>
        {allDevices.length > 0 ? (
          <div className="grid grid-cols-2 lg:grid-cols-3 gap-2">
            {allDevices.map((d,i)=>(
              <div key={i} className="flex items-center gap-3 px-3 py-2 bg-gray-50 rounded-lg">
                <div className="w-2 h-2 rounded-full bg-green-400 flex-shrink-0"/>
                <div className="min-w-0">
                  <div className="font-mono text-sm text-gray-800 truncate">{d.ip||d.address}</div>
                  <div className="text-xs text-gray-400 font-mono truncate">{d.mac||''} {d.interface?`· ${d.interface}`:''}</div>
                </div>
              </div>
            ))}
          </div>
        ) : loading.arp ? (
          <div className="text-sm text-gray-400 animate-pulse">Running arp -a…</div>

// ── AI Assistant ──────────────────────────────────────────────────────────────
function AIAssistantView({ stats, threats, secChecks, ports }) {
  const [tab, setTab]           = useState('chat');
  const [messages, setMessages] = useState([{role:'assistant',content:'CyberGuard AI ready. Ask me about vulnerabilities, exploit analysis, or security research.'}]);
  const [input, setInput]       = useState('');
  const [loading, setLoading]   = useState(false);
  const [aiStatus, setAiStatus] = useState(null);
  const [memories, setMemories] = useState([]);
  const [crashes,  setCrashes]  = useState([]);
  const [sessions, setSessions] = useState([]);
  const [memTotal, setMemTotal] = useState(0);
  const [dbLoading, setDbLoading] = useState(false);
  const [honeypot, setHoneypot] = useState(null);
  const [firewall, setFirewall] = useState(null);
  const endRef = useRef(null);

  useEffect(() => { endRef.current?.scrollIntoView({behavior:'smooth'}); }, [messages]);
  useEffect(() => {
    if (cg.kerriganStatus) cg.kerriganStatus().then(s=>setAiStatus(s)).catch(()=>{});
    // Pull live honeypot + firewall state for system context
    const refreshLive = () => {
      if (cg.honeypotCounts) cg.honeypotCounts().then(d=>setHoneypot(d)).catch(()=>{});
      if (cg.firewallBlocked) cg.firewallBlocked().then(d=>setFirewall(d)).catch(()=>{});
    };
    refreshLive();
    const t = setInterval(refreshLive, 30000);
    return () => clearInterval(t);
  }, []);

  const loadDb = () => {
    setDbLoading(true);
    Promise.allSettled([
      cg.dbMemories ? cg.dbMemories(20, 0) : Promise.resolve({memories:[],total:0}),
      cg.dbCrashes  ? cg.dbCrashes(20)     : Promise.resolve({crashes:[]}),
      cg.dbSessions ? cg.dbSessions(10)    : Promise.resolve({sessions:[]}),
    ]).then(([m, c, s]) => {
      if (m.value) { setMemories(m.value.memories||[]); setMemTotal(m.value.total||0); }
      if (c.value) setCrashes(c.value.crashes||[]);
      if (s.value) setSessions(s.value.sessions||[]);
      setDbLoading(false);
    });
  };

  useEffect(() => { if (tab === 'memory' || tab === 'crashes' || tab === 'sessions') loadDb(); }, [tab]);

  const buildSystemContext = () => {
    const lines = ['[LIVE SYSTEM STATE — use this to answer questions about this specific machine]'];
    if (stats) {
      lines.push(`CPU: ${Math.round(stats.cpu)}% | RAM: ${stats.ramUsedGB}/${stats.ramTotalGB} GB | Net I/O: ${((stats.netInKB+stats.netOutKB)/1024).toFixed(1)} MB/s`);
    }
    if (threats && threats.length) {
      lines.push(`Active threats (${threats.length}):`);
      threats.slice(0,10).forEach(t => lines.push(`  - [${t.severity||'low'}] ${t.type} | ${t.detail||''} | src: ${t.source||'?'}`));
    } else {
      lines.push('Active threats: none detected');
    }
    if (secChecks && secChecks.length) {
      const failed = secChecks.filter(c=>c.status==='fail'||c.status==='warn');
      if (failed.length) {
        lines.push(`Security check warnings (${failed.length}):`);
        failed.forEach(c => lines.push(`  - [${c.status}] ${c.name}: ${c.detail||''}`));
      } else {
        lines.push('Security checks: all passing');
      }
    }
    if (ports && ports.length) {
      const open = ports.filter(p=>p.state==='LISTEN'||p.state==='listen');
      lines.push(`Open listening ports (${open.length}): ${open.slice(0,8).map(p=>`${p.port}/${p.process||'?'}`).join(', ')}`);
    }
    // Honeypot live counts + recent attacker IPs
    if (honeypot) {
      lines.push(`Honeypot hits — SSH(2222): ${honeypot.ssh||0} | Web(8080): ${honeypot.web||0} | DB(3307): ${honeypot.database||0} | Total: ${honeypot.total||0}`);
      if (honeypot.recent && honeypot.recent.length) {
        lines.push('Recent honeypot events:');
        honeypot.recent.slice(0,5).forEach(e =>
          lines.push(`  - [${e.honeypot_type?.toUpperCase()}] ${e.attacker_ip}:${e.attacker_port} | payload: ${(e.payload||'').slice(0,60)} | at: ${e.created_at}`)
        );
      }
    }
    // Firewall block table
    if (firewall) {
      lines.push(`pf firewall: ${firewall.pf_active ? 'ACTIVE' : 'INACTIVE'} | ${firewall.blocked_count||0} IPs blocked`);
      if (firewall.blocked_ips && firewall.blocked_ips.length) {
        lines.push(`Blocked IPs: ${firewall.blocked_ips.join(', ')}`);
      }
    }
    return lines.join('\n');
  };

  const send = async () => {
    const text = input.trim();
    if (!text || loading) return;
    setInput('');
    const next = [...messages, {role:'user',content:text}];
    setMessages(next);
    setLoading(true);
    try {
      const history = next.slice(-8).map(m=>({role:m.role,content:m.content}));
      const systemCtx = buildSystemContext();
      const r = await cg.kerriganChat(text, history, systemCtx);
      setMessages(p=>[...p,{role:'assistant',content:r.reply||r.error||'No response'}]);
    } catch(e) {
      setMessages(p=>[...p,{role:'assistant',content:`[Error: ${e.message}]`}]);
    } finally { setLoading(false); }
  };

  const tabs = [['chat','Chat'],['memory','Memories'],['crashes','Crashes'],['sessions','Sessions']];

  return (
    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 flex flex-col" style={{height:'calc(100vh - 180px)'}}>
      {/* Header */}
      <div className="p-4 border-b border-gray-100 flex items-center justify-between">
        <div className="flex items-center">
          <div className="w-9 h-9 bg-gradient-to-br from-purple-500 to-blue-600 rounded-xl flex items-center justify-center mr-3">
            <MessageSquare className="w-4 h-4 text-white"/>
          </div>
          <div>
            <h3 className="text-base font-bold text-gray-900">Kerrigan AI — {aiStatus?.model||'deepseek-coder:6.7b'}</h3>
            <p className="text-xs text-gray-500">{aiStatus?.online ? `Online · ${memTotal} memories in DB` : 'Connecting…'}</p>
          </div>
        </div>
        <div className={`flex items-center text-xs px-2 py-1 rounded-full ${aiStatus?.online?'bg-green-50 text-green-700':'bg-gray-100 text-gray-500'}`}>
          <div className={`w-1.5 h-1.5 rounded-full mr-1.5 ${aiStatus?.online?'bg-green-500':'bg-gray-400'}`}/>
          {aiStatus?.online ? 'Ready' : 'Offline'}
        </div>
      </div>

      {/* Tabs */}
      <div className="flex border-b border-gray-100 px-4">
        {tabs.map(([id,label])=>(
          <button key={id} onClick={()=>setTab(id)}
            className={`px-4 py-2.5 text-sm font-medium border-b-2 transition-colors mr-1 ${tab===id?'border-blue-600 text-blue-600':'border-transparent text-gray-500 hover:text-gray-700'}`}>
            {label}
          </button>
        ))}
      </div>

      {/* Chat tab */}
      {tab==='chat' && <>
        <div className="flex-1 overflow-y-auto p-5 space-y-4">
          {messages.map((m,i)=>(
            <div key={i} className={`flex ${m.role==='user'?'justify-end':'justify-start'}`}>
              <div className={`max-w-3xl px-4 py-3 rounded-2xl text-sm whitespace-pre-wrap break-words ${m.role==='user'?'bg-blue-600 text-white rounded-br-sm':'bg-gray-100 text-gray-800 rounded-bl-sm'}`}>
                {m.content}
              </div>
            </div>
          ))}
          {loading && <div className="flex justify-start"><div className="bg-gray-100 text-gray-500 px-4 py-3 rounded-2xl rounded-bl-sm text-sm animate-pulse">Thinking…</div></div>}
          <div ref={endRef}/>
        </div>
        <div className="p-4 border-t border-gray-100">
          <div className="flex gap-2">
            <input value={input} onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&(e.preventDefault(),send())}
              placeholder="Ask about vulnerabilities, malware, exploit techniques…"
              className="flex-1 px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
            <button onClick={send} disabled={loading||!input.trim()}
              className="px-4 py-2.5 bg-blue-600 text-white rounded-xl hover:bg-blue-700 disabled:opacity-40 transition-colors">
              <Send className="w-4 h-4"/>
            </button>
          </div>
        </div>
      </>}

      {/* Memory tab */}
      {tab==='memory' && (
        <div className="flex-1 overflow-y-auto p-5">
          <div className="flex items-center justify-between mb-4">
            <span className="text-sm font-medium text-gray-700">{memTotal} total memories in kerrigan_db</span>
            <button onClick={loadDb} disabled={dbLoading} className="text-xs bg-blue-50 text-blue-600 px-3 py-1.5 rounded-lg hover:bg-blue-100 disabled:opacity-50">
              {dbLoading ? 'Loading…' : 'Refresh'}
            </button>
          </div>
          {memories.length === 0
            ? <div className="text-sm text-gray-400 text-center py-12">{dbLoading ? 'Loading…' : 'No memories yet'}</div>
            : memories.map((m,i)=>(
              <div key={m.id} className="border border-gray-100 rounded-xl p-4 mb-3 hover:bg-gray-50">
                <div className="flex items-start justify-between gap-2 mb-1">
                  <span className="text-xs bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full font-medium">{m.expert||'general'}</span>
                  <span className="text-xs text-gray-400 flex-shrink-0">{m.created_at ? new Date(m.created_at).toLocaleString() : '—'}</span>
                </div>
                <p className="text-sm text-gray-800 mt-1">{m.content}</p>
                {m.tags && <p className="text-xs text-gray-400 mt-1">{m.tags}</p>}
              </div>
            ))
          }
        </div>
      )}

      {/* Crashes tab */}
      {tab==='crashes' && (
        <div className="flex-1 overflow-y-auto p-5">
          <div className="flex items-center justify-between mb-4">
            <span className="text-sm font-medium text-gray-700">Crash findings from kerrigan_db</span>
            <button onClick={loadDb} disabled={dbLoading} className="text-xs bg-blue-50 text-blue-600 px-3 py-1.5 rounded-lg hover:bg-blue-100 disabled:opacity-50">
              {dbLoading ? 'Loading…' : 'Refresh'}
            </button>
          </div>
          {crashes.length === 0
            ? <div className="text-sm text-gray-400 text-center py-12">{dbLoading ? 'Loading…' : 'No crashes logged'}</div>
            : crashes.map((c,i)=>(
              <div key={i} className={`border rounded-xl p-4 mb-3 ${c.exploitability==='high'?'border-red-200 bg-red-50':c.exploitability==='medium'?'border-yellow-200 bg-yellow-50':'border-gray-200'}`}>
                <div className="flex items-center justify-between mb-1">
                  <span className="font-medium text-sm text-gray-900">{c.crash_type||c.type||'Unknown crash'}</span>
                  <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${c.exploitability==='high'?'bg-red-200 text-red-800':c.exploitability==='medium'?'bg-yellow-200 text-yellow-800':'bg-gray-200 text-gray-700'}`}>
                    {c.exploitability||'unknown'} exploitability
                  </span>
                </div>
                {c.signal && <p className="text-xs text-gray-600">Signal: {c.signal}</p>}
                {c.created_at && <p className="text-xs text-gray-400 mt-1">{new Date(c.created_at).toLocaleString()}</p>}
              </div>
            ))

      )}

      {/* Sessions tab */}
      {tab==='sessions' && (
        <div className="flex-1 overflow-y-auto p-5">
          <div className="flex items-center justify-between mb-4">
            <span className="text-sm font-medium text-gray-700">Kerrigan training sessions</span>
            <button onClick={loadDb} disabled={dbLoading} className="text-xs bg-blue-50 text-blue-600 px-3 py-1.5 rounded-lg hover:bg-blue-100 disabled:opacity-50">
              {dbLoading ? 'Loading…' : 'Refresh'}
            </button>
          </div>
          {sessions.length === 0
            ? <div className="text-sm text-gray-400 text-center py-12">{dbLoading ? 'Loading…' : 'No sessions logged'}</div>
            : sessions.map((s,i)=>(
              <div key={i} className="border border-gray-200 rounded-xl p-4 mb-3">
                <div className="flex items-center justify-between mb-1">
                  <span className="font-medium text-sm text-gray-900">{s.session_id||`Session ${s.id}`}</span>
                  <span className="text-xs text-gray-400">{s.started_at ? new Date(s.started_at).toLocaleString() : '—'}</span>
                </div>
                <div className="grid grid-cols-3 gap-2 mt-2 text-xs text-gray-600">
                  {s.crashes_found != null && <span>Crashes: <strong>{s.crashes_found}</strong></span>}

      )}
    </div>
  );
}

function HoneypotToasts() {
  const [toasts, setToasts] = useState([]);

  useEffect(() => {
    if (!cg.onHoneypotHit) return;
    cg.onHoneypotHit(hit => {
      const id = Date.now();
      const icon = hit.type === 'ssh' ? '🔐' : hit.type === 'web' ? '🌐' : '🗄️';
      const label = hit.type === 'ssh' ? 'SSH Honeypot' : hit.type === 'web' ? 'Web Honeypot' : 'DB Honeypot';
      setToasts(t => [...t, { id, icon, label, ip: hit.ip, payload: hit.payload }]);
      setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 8000);
    });
    return () => cg.off && cg.off('honeypot-hit');
  }, []);

  if (!toasts.length) return null;

  return (
    <div style={{position:'fixed', bottom:'24px', right:'24px', zIndex:9999, display:'flex', flexDirection:'column', gap:'8px'}}>
      {toasts.map(t => (
        <div key={t.id} className="bg-gray-900 text-white rounded-2xl shadow-2xl px-5 py-4 flex items-start gap-3"
          style={{minWidth:'300px', maxWidth:'380px', animation:'slideIn 0.3s ease'}}>
          <span style={{fontSize:'24px'}}>{t.icon}</span>
          <div className="flex-1 min-w-0">
            <div className="font-bold text-sm text-red-400">{t.label} Hit</div>
            <div className="text-xs text-gray-300 font-mono mt-0.5">{t.ip}</div>
            {t.payload && <div className="text-xs text-gray-400 mt-1 truncate">{t.payload.slice(0,60)}</div>}
          </div>
          <button onClick={()=>setToasts(ts=>ts.filter(x=>x.id!==t.id))} className="text-gray-500 hover:text-white text-lg leading-none">×</button>
        </div>
      ))}
    </div>
  );
}

function App() {
  const [active,    setActive]    = useState('dashboard');
  const [stats,     setStats]     = useState(null);
  const [threats,   setThreats]   = useState([]);
  const [conns,     setConns]     = useState([]);
  const [ports,     setPorts]     = useState([]);
  const [devices,   setDevices]   = useState([]);
  const [secChecks, setSecChecks] = useState([]);
  const [sysStatus, setSysStatus] = useState({ label: 'Connecting…', color: 'bg-gray-400', text: 'text-gray-500', ai: null, pf: null });

  useEffect(() => {
    Promise.allSettled([
      cg.getSecurityChecks && cg.getSecurityChecks(),
      cg.getNetworkDevices && cg.getNetworkDevices(),
    ]).then(([c,d]) => {
      if (c.status==='fulfilled' && c.value) setSecChecks(c.value);
      if (d.status==='fulfilled' && d.value) setDevices(d.value);
    });

    if (cg.onStatsUpdate)       cg.onStatsUpdate(d => setStats(d));
    if (cg.onThreatDetected)    cg.onThreatDetected(t => setThreats(p => [t,...p].slice(0,50)));
    if (cg.onConnectionsUpdate) cg.onConnectionsUpdate(d => setConns(d||[]));
    if (cg.onPortsUpdate)       cg.onPortsUpdate(d => setPorts(d||[]));

    return () => ['stats-update','threat-detected','connections-update','ports-update'].forEach(ch => cg.off && cg.off(ch));
  }, []);

  // Poll system status every 10s — uses IPC bridge in Electron, direct fetch as fallback
  useEffect(() => {
    const check = async () => {
      let s = null, fw = null;
      try {
        // Electron path: preload bridge
        if (cg.kerriganStatus)      s  = await cg.kerriganStatus();
        if (cg.firewallBlocked)     fw = await cg.firewallBlocked();
        // Browser/dev fallback: direct HTTP (requires CORS on backend)
        if (!s)  s  = await fetch('http://127.0.0.1:7432/status').then(r => r.json()).catch(() => null);
        if (!fw) fw = await fetch('http://127.0.0.1:7432/firewall/blocked').then(r => r.json()).catch(() => null);
      } catch(_) {}

      const aiOk  = s?.ai_ok      ?? false;
      const pfOk  = fw?.pf_active ?? false;
      const criticalThreats = threats.filter(t => t.severity === 'critical').length;
      const failedChecks    = secChecks.filter(c => c.status === 'fail').length;

      let label, color, text;
      if (criticalThreats > 0) {
        label = `${criticalThreats} Critical Threat${criticalThreats > 1 ? 's' : ''}`;
        color = 'bg-red-500'; text = 'text-red-700';
      } else if (!s) {
        label = 'Backend Offline';
        color = 'bg-red-500'; text = 'text-red-700';
      } else if (!aiOk) {
        label = 'AI Offline';
        color = 'bg-red-400'; text = 'text-red-600';
      } else if (!pfOk) {
        label = 'Firewall Inactive';
        color = 'bg-yellow-400'; text = 'text-yellow-700';
      } else if (failedChecks > 0) {
        label = `${failedChecks} Check${failedChecks > 1 ? 's' : ''} Failing`;
        color = 'bg-yellow-400'; text = 'text-yellow-700';
      } else {
        label = 'All Systems Operational';
        color = 'bg-green-400'; text = 'text-green-700';
      }
      setSysStatus({ label, color, text, ai: aiOk, pf: pfOk });
    };
    check();
    const t = setInterval(check, 10000);
    return () => clearInterval(t);
  }, [threats, secChecks]);

  const cpu = stats ? Math.round(stats.cpu) : 0;

  return (
    <div className="min-h-screen bg-gray-50">
      <HoneypotToasts/>
      {/* Header — electron-drag makes the whole bar a window drag handle */}
      <div className="bg-white shadow-sm border-b border-gray-200 electron-drag">
        <div className="max-w-screen-2xl mx-auto px-6 py-4 flex items-center justify-between">
          <div className="flex items-center">
            <div className="w-10 h-10 bg-gradient-to-br from-red-500 to-purple-600 rounded-2xl flex items-center justify-center mr-4">
              <Shield className="w-6 h-6 text-white"/>
            </div>
            <div>
              <h1 className="text-2xl font-bold text-gray-900">CyberGuard AI Enterprise</h1>
              <p className="text-sm text-gray-600">Advanced Security Operations Console</p>
            </div>
          </div>
          <div className="flex items-center space-x-4 electron-no-drag">
            <div className={`flex items-center text-sm font-medium px-3 py-1.5 rounded-full bg-opacity-10 ${sysStatus.text}`}
                 style={{background: sysStatus.color === 'bg-green-400' ? '#f0fdf4' : sysStatus.color === 'bg-yellow-400' ? '#fefce8' : '#fef2f2'}}>
              <div className={`w-2 h-2 rounded-full mr-2 flex-shrink-0 animate-pulse ${sysStatus.color}`}></div>
              {sysStatus.label}
            </div>
            <button onClick={()=>setActive('ids-ips')} className="p-2 hover:bg-gray-100 rounded-full">
              <SettingsIcon className="w-5 h-5 text-gray-600"/>
            </button>
          </div>
        </div>
      </div>

      <div className="max-w-screen-2xl mx-auto px-6 py-6 flex gap-6">
        {/* Sidebar */}
        <div className="w-56 flex-shrink-0 bg-white rounded-2xl p-4 shadow-sm border border-gray-100 self-start sticky top-6">
          <nav className="space-y-1">
            {MODULES.map(({id,label,Icon,bg,txt,bdr,ico}) => {
              const on = active===id;
              return (
                <button key={id} onClick={()=>setActive(id)}
                  className={`w-full flex items-center p-3 rounded-xl text-left transition-colors ${on?`${bg} ${txt} border ${bdr}`:'hover:bg-gray-50 text-gray-700'}`}>
                  <Icon className={`w-4 h-4 mr-3 flex-shrink-0 ${on?ico:'text-gray-500'}`}/>
                  <span className="font-medium text-sm">{label}</span>
                </button>
              );
            })}
          </nav>
          <div className="mt-6 p-4 bg-gray-50 rounded-xl">
            <h4 className="font-semibold text-gray-900 text-sm mb-3">System Status</h4>
            <div className="space-y-2 text-xs">
              {[['CPU', `${cpu}%`],['Threats', String(threats.length)],['Connections', String(conns.length)],['RAM', stats?`${stats.ramUsedGB.toFixed(1)}GB`:'—']].map(([k,v],i)=>(
                <div key={i} className="flex justify-between"><span className="text-gray-600">{k}</span><span className="font-medium">{v}</span></div>
              ))}
            </div>
          </div>
        </div>

        {/* Main content */}
        <div className="flex-1 min-w-0">
          {active==='dashboard'       && <DashboardView stats={stats} threats={threats} secChecks={secChecks}/>}
          {active==='protegrity-demo' && <ProtegityDemoView/>}
          {active==='ai-assistant'    && <AIAssistantView stats={stats} threats={threats} secChecks={secChecks} ports={ports}/>}
          {active==='ai-patcher'      && <AIPatcherView/>}
          {active==='packet-analyzer' && <PacketAnalyzerView connections={conns}/>}
          {active==='vuln-scanner'    && <VulnScannerView secChecks={secChecks}/>}
          {active==='pen-testing'     && <PenTestingView/>}
          {active==='crypto-audit'    && <CryptoAuditView/>}
          {active==='ids-ips'         && <IDSIPSView threats={threats}/>}
          {active==='forensics'       && <ForensicsView/>}
          {active==='network-map'     && <NetworkMapView devices={devices} ports={ports}/>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
